<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Routine | BAUET</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .day-pill-nav {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .day-pill-btn {
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.875rem;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        .day-pill-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
    </style>
</head>

<body>

    <div class="app-wrapper">
        <aside class="app-sidebar" id="appSidebar"></aside>

        <div class="app-main">
            <header class="app-topbar" id="appTopbar"></header>

            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Weekly Class Schedule & Routine</h1>
                        <p class="page-description">Semester Fall 2026 &bull; Room Allocations & Faculty Lecture Timings</p>
                    </div>
                    <button class="btn btn-outline btn-sm" onclick="window.print()">🖨️ Print Timetable</button>
                </div>

                
                <div class="day-pill-nav" id="dayPillNav">
                    <button class="day-pill-btn active" data-day="All">All Days</button>
                    <button class="day-pill-btn" data-day="Monday">Monday</button>
                    <button class="day-pill-btn" data-day="Tuesday">Tuesday</button>
                    <button class="day-pill-btn" data-day="Wednesday">Wednesday</button>
                    <button class="day-pill-btn" data-day="Thursday">Thursday</button>
                    <button class="day-pill-btn" data-day="Friday">Friday</button>
                    <button class="day-pill-btn" data-day="Saturday">Saturday</button>
                </div>

                
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title" id="currentDayHeader">Master Routine Matrix</h2>
                        <span class="badge badge-info" id="routineSlotsCountBadge">5 Active Sessions</span>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Day</th>
                                        <th>Time Slot</th>
                                        <th>Course Code & Title</th>
                                        <th>Section</th>
                                        <th>Classroom</th>
                                        <th>Instructor</th>
                                    </tr>
                                </thead>
                                <tbody id="routineTbody">
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    
    <script type="module" src="../js/firebase.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/students.js"></script>
    <script>
        let activeDay = 'All';

        document.addEventListener('DOMContentLoaded', () => {
            StudentPortal.init('routine', 'Class Routine');
            renderRoutineTable();

            document.querySelectorAll('.day-pill-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.day-pill-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeDay = btn.dataset.day;
                    renderRoutineTable();
                });
            });
        });

        function renderRoutineTable() {
            const routineData = UMSStorage.getData('routine');
            const courses = UMSStorage.getData('courses');
            const tbody = document.getElementById('routineTbody');

            const filtered = routineData.filter(r => {
                if (activeDay === 'All') return true;
                return r.day.toLowerCase() === activeDay.toLowerCase();
            });

            document.getElementById('currentDayHeader').textContent = activeDay === 'All' ? 'Master Routine Matrix' : `${activeDay} Schedule`;
            document.getElementById('routineSlotsCountBadge').textContent = `${filtered.length} Active Sessions`;

            if (filtered.length === 0) {
                tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center" style="padding: 2.5rem;">
              <div class="empty-state-icon">⏰</div>
              <div class="empty-state-title">No Lectures Scheduled</div>
              <p class="empty-state-desc">No classroom sessions or laboratory hours configured for ${activeDay}.</p>
            </td>
          </tr>
        `;
                return;
            }

            tbody.innerHTML = filtered.map(r => {
                const courseObj = courses.find(c => c.code === r.course);
                const title = courseObj ? courseObj.title : 'Departmental Lecture';

                return `
          <tr>
            <td><span class="badge badge-neutral"><strong>${r.day}</strong></span></td>
            <td><strong style="color: var(--primary);">${r.time}</strong></td>
            <td>
              <div><strong>${r.course}</strong></div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">${title}</div>
            </td>
            <td>Sec ${r.section}</td>
            <td><span class="badge badge-info">${r.room}</span></td>
            <td>${r.teacher}</td>
          </tr>
        `;
            }).join('');
        }
    </script>
</body>

</html>
