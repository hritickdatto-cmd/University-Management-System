<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Routine Management | BAUET</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <div class="app-wrapper">
        <aside class="app-sidebar" id="appSidebar"></aside>

        <div class="app-main">
            <header class="app-topbar" id="appTopbar"></header>

            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Class Routine & Timetable Scheduler</h1>
                        <p class="page-description">Manage lecture allocations with automated room & faculty double-booking detection</p>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="openRoutineModal()">
            <span>➕ Add Routine Slot</span>
          </button>
                </div>

                
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="card-body" style="padding: 1rem 1.5rem;">
                        <div style="display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap;">
                            <div class="toolbar-filters">
                                <select id="dayFilter" class="form-control" style="width: auto;">
                  <option value="all">All Days</option>
                  <option value="Monday">Monday</option>
                  <option value="Tuesday">Tuesday</option>
                  <option value="Wednesday">Wednesday</option>
                  <option value="Thursday">Thursday</option>
                  <option value="Friday">Friday</option>
                  <option value="Saturday">Saturday</option>
                </select>
                                <select id="roomFilter" class="form-control" style="width: auto;">
                  <option value="all">All Classrooms</option>
                  <option value="Lab-302">Lab-302</option>
                  <option value="Room-204">Room-204</option>
                  <option value="Room-205">Room-205</option>
                  <option value="Room-108">Room-108</option>
                </select>
                            </div>
                        </div>
                    </div>
                </div>

                
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Scheduled Lecture Slots</h2>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Day</th>
                                        <th>Time Window</th>
                                        <th>Course Code</th>
                                        <th>Section</th>
                                        <th>Assigned Faculty</th>
                                        <th>Classroom / Lab</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="routineMasterTbody">
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    
    <div class="modal-overlay" id="routineModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" id="routineModalTitle">Add Lecture Schedule Slot</h3>
                <button class="modal-close" aria-label="Close modal">&times;</button>
            </div>
            <form id="routineForm">
                <input type="hidden" id="routineEditId">
                <div class="modal-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="rtDay">Lecture Day <span class="required">*</span></label>
                            <select id="rtDay" class="form-control" required>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
              </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="rtCourse">Course <span class="required">*</span></label>
                            <select id="rtCourse" class="form-control" required></select>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="rtStartTime">Start Time <span class="required">*</span></label>
                            <input type="text" id="rtStartTime" class="form-control" required placeholder="10:00 AM">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="rtEndTime">End Time <span class="required">*</span></label>
                            <input type="text" id="rtEndTime" class="form-control" required placeholder="11:30 AM">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="rtTeacher">Faculty Instructor <span class="required">*</span></label>
                            <select id="rtTeacher" class="form-control" required></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="rtSection">Section <span class="required">*</span></label>
                            <input type="text" id="rtSection" class="form-control" value="A" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="rtRoom">Classroom / Lab Venue <span class="required">*</span></label>
                        <input type="text" id="rtRoom" class="form-control" required placeholder="Lab-302">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline btn-sm" onclick="UMSApp.closeModal('routineModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Schedule Session</button>
                </div>
            </form>
        </div>
    </div>

    
    <script type="module" src="../js/firebase.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AdminPortal.init('routine', 'Class Routine');

            const courses = UMSStorage.getData('courses');
            const teachers = UMSStorage.getData('teachers');

            const courseSelect = document.getElementById('rtCourse');
            courses.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.code;
                opt.textContent = `${c.code} - ${c.title}`;
                courseSelect.appendChild(opt);
            });

            const teacherSelect = document.getElementById('rtTeacher');
            teachers.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.name;
                opt.textContent = t.name;
                teacherSelect.appendChild(opt);
            });

            renderRoutine();
            document.getElementById('dayFilter').addEventListener('change', renderRoutine);
            document.getElementById('roomFilter').addEventListener('change', renderRoutine);
            document.getElementById('routineForm').addEventListener('submit', handleSaveRoutine);
        });

        function renderRoutine() {
            const routine = UMSStorage.getData('routine');
            const day = document.getElementById('dayFilter').value;
            const room = document.getElementById('roomFilter').value;
            const tbody = document.getElementById('routineMasterTbody');

            const filtered = routine.filter(r => {
                const matchesDay = day === 'all' || r.day === day;
                const matchesRoom = room === 'all' || r.room === room;
                return matchesDay && matchesRoom;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center" style="padding: 2.5rem;">No lecture slots scheduled.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(r => `
        <tr>
          <td><span class="badge badge-neutral"><strong>${r.day}</strong></span></td>
          <td><strong style="color: var(--primary);">${r.time}</strong></td>
          <td><strong>${r.course}</strong></td>
          <td>Sec ${r.section}</td>
          <td>${r.teacher}</td>
          <td><span class="badge badge-info">${r.room}</span></td>
          <td>
            <div style="display: flex; gap: 0.35rem;">
              <button class="btn btn-outline btn-sm" onclick="editRoutine('${r.id}')">✏️</button>
              <button class="btn btn-outline btn-sm text-danger" onclick="deleteRoutine('${r.id}')" style="color: var(--danger); border-color: var(--danger);">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
        }

        function openRoutineModal() {
            document.getElementById('routineModalTitle').textContent = 'Add Lecture Schedule Slot';
            document.getElementById('routineEditId').value = '';
            document.getElementById('rtStartTime').value = '10:00 AM';
            document.getElementById('rtEndTime').value = '11:30 AM';
            document.getElementById('rtRoom').value = 'Lab-302';
            UMSApp.openModal('routineModal');
        }

        function editRoutine(id) {
            const r = UMSStorage.findData('routine', item => item.id === id);
            if (!r) return;

            document.getElementById('routineModalTitle').textContent = 'Edit Schedule Slot';
            document.getElementById('routineEditId').value = r.id;
            document.getElementById('rtDay').value = r.day;
            document.getElementById('rtCourse').value = r.course;
            document.getElementById('rtTeacher').value = r.teacher;
            document.getElementById('rtSection').value = r.section;
            document.getElementById('rtRoom').value = r.room;

            const parts = r.time.split('-');
            if (parts.length === 2) {
                document.getElementById('rtStartTime').value = parts[0].trim();
                document.getElementById('rtEndTime').value = parts[1].trim();
            }

            UMSApp.openModal('routineModal');
        }

        function handleSaveRoutine(e) {
            e.preventDefault();
            const editId = document.getElementById('routineEditId').value;
            const day = document.getElementById('rtDay').value;
            const course = document.getElementById('rtCourse').value;
            const startTime = document.getElementById('rtStartTime').value.trim();
            const endTime = document.getElementById('rtEndTime').value.trim();
            const teacher = document.getElementById('rtTeacher').value;
            const section = document.getElementById('rtSection').value.trim();
            const room = document.getElementById('rtRoom').value.trim();

            const time = `${startTime} - ${endTime}`;

            // Conflict Validation
            const conflictCheck = AdminPortal.checkScheduleConflict({
                day,
                startTime,
                endTime,
                room,
                teacher,
                course
            }, editId);

            if (conflictCheck.conflict) {
                UMSApp.toast(conflictCheck.message, 'error', 'Timetable Conflict Detected');
                return;
            }

            if (editId) {
                UMSStorage.updateData('routine', editId, {
                    day,
                    time,
                    course,
                    teacher,
                    room,
                    section
                });
                UMSApp.toast('Schedule slot updated.', 'success');
            } else {
                const id = 'RT-' + Date.now().toString().slice(-4);
                UMSStorage.addData('routine', {
                    id,
                    day,
                    time,
                    course,
                    teacher,
                    room,
                    section
                });
                UMSApp.toast('Session slot successfully scheduled.', 'success');
            }

            UMSApp.closeModal('routineModal');
            renderRoutine();
        }

        function deleteRoutine(id) {
            if (!confirm('Are you sure you want to remove this lecture session?')) return;
            UMSStorage.deleteData('routine', id);
            UMSApp.toast('Lecture session removed.', 'warning');
            renderRoutine();
        }
    </script>
</body>

</html>
