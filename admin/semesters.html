<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Semesters | BAUET</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <div class="app-wrapper">
        <aside class="app-sidebar" id="appSidebar"></aside>

        <div class="app-main">
            <header class="app-topbar" id="appTopbar"></header>

            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Academic Terms & Calendars</h1>
                        <p class="page-description">Configure academic semesters, course registration windows, and term statuses</p>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="openSemesterModal()">
            <span>➕ Create New Semester</span>
          </button>
                </div>

                
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Academic Semesters List</h2>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Semester Name</th>
                                        <th>Academic Year</th>
                                        <th>Start Date</th>
                                        <th>End Date</th>
                                        <th>Course Reg. Deadline</th>
                                        <th>Term Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="semestersTbody">
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    
    <div class="modal-overlay" id="semesterModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" id="semesterModalTitle">Create Academic Term</h3>
                <button class="modal-close" aria-label="Close modal">&times;</button>
            </div>
            <form id="semesterForm">
                <input type="hidden" id="semEditId">
                <div class="modal-body">
                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="semName">Semester Name <span class="required">*</span></label>
                            <input type="text" id="semName" class="form-control" required placeholder="Spring 2027">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="semYear">Year <span class="required">*</span></label>
                            <input type="number" id="semYear" class="form-control" required value="2027">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="semStart">Start Date <span class="required">*</span></label>
                            <input type="date" id="semStart" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="semEnd">End Date <span class="required">*</span></label>
                            <input type="date" id="semEnd" class="form-control" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="semDeadline">Registration Deadline</label>
                            <input type="date" id="semDeadline" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="semStatus">Term Status <span class="required">*</span></label>
                            <select id="semStatus" class="form-control">
                <option value="Active">Active</option>
                <option value="Upcoming">Upcoming</option>
                <option value="Completed">Completed</option>
              </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline btn-sm" onclick="UMSApp.closeModal('semesterModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save Semester</button>
                </div>
            </form>
        </div>
    </div>

    
    <script type="module" src="../js/firebase.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AdminPortal.init('semesters', 'Academic Terms');
            renderSemesters();
            document.getElementById('semesterForm').addEventListener('submit', handleSaveSemester);
        });

        function renderSemesters() {
            const semesters = UMSStorage.getData('semesters');
            const tbody = document.getElementById('semestersTbody');

            tbody.innerHTML = semesters.map(s => {
                let badgeClass = 'badge-neutral';
                if (s.status === 'Active') badgeClass = 'badge-success';
                if (s.status === 'Upcoming') badgeClass = 'badge-info';

                return `
          <tr>
            <td><strong>${s.name}</strong></td>
            <td>${s.year}</td>
            <td>${s.startDate}</td>
            <td>${s.endDate}</td>
            <td>${s.regDeadline || 'N/A'}</td>
            <td><span class="badge ${badgeClass}">${s.status}</span></td>
            <td>
              <div style="display: flex; gap: 0.35rem;">
                <button class="btn btn-outline btn-sm" onclick="editSemester('${s.id}')">✏️</button>
                <button class="btn btn-outline btn-sm text-danger" onclick="deleteSemester('${s.id}')" style="color: var(--danger); border-color: var(--danger);">🗑️</button>
              </div>
            </td>
          </tr>
        `;
            }).join('');
        }

        function openSemesterModal() {
            document.getElementById('semesterModalTitle').textContent = 'Create Academic Term';
            document.getElementById('semEditId').value = '';
            document.getElementById('semName').value = '';
            document.getElementById('semYear').value = '2027';
            document.getElementById('semStart').value = '';
            document.getElementById('semEnd').value = '';
            document.getElementById('semDeadline').value = '';
            document.getElementById('semStatus').value = 'Upcoming';
            UMSApp.openModal('semesterModal');
        }

        function editSemester(id) {
            const s = UMSStorage.findData('semesters', item => item.id === id);
            if (!s) return;

            document.getElementById('semesterModalTitle').textContent = 'Modify Semester';
            document.getElementById('semEditId').value = s.id;
            document.getElementById('semName').value = s.name;
            document.getElementById('semYear').value = s.year;
            document.getElementById('semStart').value = s.startDate;
            document.getElementById('semEnd').value = s.endDate;
            document.getElementById('semDeadline').value = s.regDeadline || '';
            document.getElementById('semStatus').value = s.status;

            UMSApp.openModal('semesterModal');
        }

        function handleSaveSemester(e) {
            e.preventDefault();
            const editId = document.getElementById('semEditId').value;
            const name = document.getElementById('semName').value.trim();
            const year = parseInt(document.getElementById('semYear').value, 10);
            const startDate = document.getElementById('semStart').value;
            const endDate = document.getElementById('semEnd').value;
            const regDeadline = document.getElementById('semDeadline').value;
            const status = document.getElementById('semStatus').value;

            if (status === 'Active') {
                // Only one semester can be active at a time
                const all = UMSStorage.getData('semesters');
                all.forEach(s => {
                    if (s.id !== editId && s.status === 'Active') s.status = 'Completed';
                });
                UMSStorage.setData('semesters', all);
            }

            if (editId) {
                UMSStorage.updateData('semesters', editId, {
                    name,
                    year,
                    startDate,
                    endDate,
                    regDeadline,
                    status
                });
                UMSApp.toast('Semester details updated.', 'success');
            } else {
                const id = 'SEM-' + year + '-' + name.replace(/\s+/g, '-').toUpperCase();
                UMSStorage.addData('semesters', {
                    id,
                    name,
                    year,
                    startDate,
                    endDate,
                    regDeadline,
                    status
                });
                UMSApp.toast('Academic term added.', 'success');
            }

            UMSApp.closeModal('semesterModal');
            renderSemesters();
        }

        function deleteSemester(id) {
            if (!confirm('Are you sure you want to delete this semester entry?')) return;
            UMSStorage.deleteData('semesters', id);
            UMSApp.toast('Semester entry deleted.', 'warning');
            renderSemesters();
        }
    </script>
</body>

</html>
