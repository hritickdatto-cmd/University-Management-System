<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registry | BAUET</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <div class="app-wrapper">
        <aside class="app-sidebar" id="appSidebar"></aside>

        <div class="app-main">
            <header class="app-topbar" id="appTopbar"></header>

            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">University Student Registry</h1>
                        <p class="page-description">Maintain institutional admission records, departmental affiliations, and academic standing</p>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="openStudentModal()">
            <span>➕ Admit New Student</span>
          </button>
                </div>

                
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="card-body" style="padding: 1rem 1.5rem;">
                        <div style="display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap;">
                            <div style="flex: 1; min-width: 240px;">
                                <input type="text" id="searchStudentInput" class="form-control" placeholder="Search by name, student ID, email...">
                            </div>
                            <div class="toolbar-filters">
                                <select id="deptFilter" class="form-control" style="width: auto;">
                  <option value="all">All Departments</option>
                  
                </select>
                                <select id="batchFilter" class="form-control" style="width: auto;">
                  <option value="all">All Batches</option>
                  <option value="2024">2024</option>
                  <option value="2023">2023</option>
                </select>
                            </div>
                        </div>
                    </div>
                </div>

                
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Enrolled Student Records</h2>
                        <span class="badge badge-primary" id="studentCountBadge">0 Records</span>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Student ID</th>
                                        <th>Name</th>
                                        <th>Dept & Program</th>
                                        <th>Batch</th>
                                        <th>Contact Email</th>
                                        <th>Telephone</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="studentsMasterTbody">
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    
    <div class="modal-overlay" id="studentModal">
        <div class="modal-dialog" style="max-width: 600px;">
            <div class="modal-header">
                <h3 class="modal-title" id="studentModalTitle">Register New Student</h3>
                <button class="modal-close" aria-label="Close modal">&times;</button>
            </div>
            <form id="studentForm">
                <input type="hidden" id="studentEditId">
                <div class="modal-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="stuIdInput">Student ID <span class="required">*</span></label>
                            <input type="text" id="stuIdInput" class="form-control" required placeholder="e.g. STU-2024-004">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="stuNameInput">Full Legal Name <span class="required">*</span></label>
                            <input type="text" id="stuNameInput" class="form-control" required placeholder="Full Name">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="stuEmailInput">Institutional Email <span class="required">*</span></label>
                            <input type="email" id="stuEmailInput" class="form-control" required placeholder="name@university.edu">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="stuPhoneInput">Phone Contact <span class="required">*</span></label>
                            <input type="tel" id="stuPhoneInput" class="form-control" required placeholder="+1 555 0000">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="stuDeptSelect">Department <span class="required">*</span></label>
                            <select id="stuDeptSelect" class="form-control" required></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="stuBatchInput">Batch <span class="required">*</span></label>
                            <input type="text" id="stuBatchInput" class="form-control" required value="2024">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="stuProgramInput">Academic Degree / Program</label>
                        <input type="text" id="stuProgramInput" class="form-control" value="B.Sc. in Computer Science">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline btn-sm" onclick="UMSApp.closeModal('studentModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save Student</button>
                </div>
            </form>
        </div>
    </div>

    
    <script type="module" src="../js/firebase.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AdminPortal.init('students', 'Student Registry');

            // Populate Department filters and selects
            const depts = UMSStorage.getData('departments');
            const deptFilter = document.getElementById('deptFilter');
            const stuDeptSelect = document.getElementById('stuDeptSelect');

            depts.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.code;
                opt.textContent = `${d.name} (${d.code})`;
                deptFilter.appendChild(opt);

                const opt2 = document.createElement('option');
                opt2.value = d.code;
                opt2.textContent = `${d.name} (${d.code})`;
                stuDeptSelect.appendChild(opt2);
            });

            renderStudents();

            document.getElementById('searchStudentInput').addEventListener('input', renderStudents);
            document.getElementById('deptFilter').addEventListener('change', renderStudents);
            document.getElementById('batchFilter').addEventListener('change', renderStudents);

            document.getElementById('studentForm').addEventListener('submit', handleSaveStudent);
        });

        function renderStudents() {
            const students = UMSStorage.getData('students');
            const search = document.getElementById('searchStudentInput').value.toLowerCase();
            const dept = document.getElementById('deptFilter').value;
            const batch = document.getElementById('batchFilter').value;
            const tbody = document.getElementById('studentsMasterTbody');

            const filtered = students.filter(s => {
                const matchesSearch = s.name.toLowerCase().includes(search) ||
                    s.id.toLowerCase().includes(search) ||
                    s.email.toLowerCase().includes(search);
                const matchesDept = dept === 'all' || s.department === dept;
                const matchesBatch = batch === 'all' || s.batch === batch;
                return matchesSearch && matchesDept && matchesBatch;
            });

            document.getElementById('studentCountBadge').textContent = `${filtered.length} Students`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center" style="padding: 2.5rem;">No student records found matching the active filters.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(s => `
        <tr>
          <td><strong>${s.id}</strong></td>
          <td>
            <div style="font-weight: 600;">${s.name}</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">${s.currentSemester || '5th'} Term</div>
          </td>
          <td>${s.department} &bull; <small style="color: var(--text-muted);">${s.program}</small></td>
          <td><span class="badge badge-neutral">${s.batch}</span></td>
          <td>${s.email}</td>
          <td>${s.phone}</td>
          <td><span class="badge badge-success">${s.status || 'Active'}</span></td>
          <td>
            <div style="display: flex; gap: 0.35rem;">
              <button class="btn btn-outline btn-sm" onclick="editStudent('${s.id}')">✏️</button>
              <button class="btn btn-outline btn-sm text-danger" onclick="deleteStudent('${s.id}')" style="color: var(--danger); border-color: var(--danger);">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
        }

        function openStudentModal() {
            document.getElementById('studentModalTitle').textContent = 'Admit New Student';
            document.getElementById('studentEditId').value = '';
            document.getElementById('stuIdInput').value = 'STU-2024-00' + (UMSStorage.getData('students').length + 1);
            document.getElementById('stuIdInput').readOnly = false;
            document.getElementById('stuNameInput').value = '';
            document.getElementById('stuEmailInput').value = '';
            document.getElementById('stuPhoneInput').value = '';
            document.getElementById('stuBatchInput').value = '2024';
            document.getElementById('stuProgramInput').value = 'B.Sc. in Computer Science';
            UMSApp.openModal('studentModal');
        }

        function editStudent(id) {
            const s = UMSStorage.findData('students', item => item.id === id);
            if (!s) return;

            document.getElementById('studentModalTitle').textContent = 'Edit Student Details';
            document.getElementById('studentEditId').value = s.id;
            document.getElementById('stuIdInput').value = s.id;
            document.getElementById('stuIdInput').readOnly = true;
            document.getElementById('stuNameInput').value = s.name;
            document.getElementById('stuEmailInput').value = s.email;
            document.getElementById('stuPhoneInput').value = s.phone;
            document.getElementById('stuDeptSelect').value = s.department;
            document.getElementById('stuBatchInput').value = s.batch;
            document.getElementById('stuProgramInput').value = s.program;

            UMSApp.openModal('studentModal');
        }

        function handleSaveStudent(e) {
            e.preventDefault();
            const editId = document.getElementById('studentEditId').value;
            const id = document.getElementById('stuIdInput').value.trim();
            const name = document.getElementById('stuNameInput').value.trim();
            const email = document.getElementById('stuEmailInput').value.trim();
            const phone = document.getElementById('stuPhoneInput').value.trim();
            const department = document.getElementById('stuDeptSelect').value;
            const batch = document.getElementById('stuBatchInput').value.trim();
            const program = document.getElementById('stuProgramInput').value.trim();

            const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

            if (editId) {
                UMSStorage.updateData('students', editId, {
                    name,
                    email,
                    phone,
                    department,
                    batch,
                    program,
                    avatar: initials
                });
                UMSApp.toast('Student record modified successfully.', 'success');
            } else {
                if (UMSStorage.findData('students', s => s.id === id)) {
                    UMSApp.toast('A student with this ID already exists.', 'error');
                    return;
                }
                const newStu = {
                    id,
                    name,
                    email,
                    phone,
                    department,
                    program,
                    batch,
                    currentSemester: '1st',
                    cgpa: 0.00,
                    totalCredits: 0,
                    avatar: initials,
                    status: 'Active'
                };
                UMSStorage.addData('students', newStu);
                UMSApp.toast('New student admitted successfully.', 'success');
            }

            UMSApp.closeModal('studentModal');
            renderStudents();
        }

        function deleteStudent(id) {
            if (!confirm(`Are you sure you want to permanently delete student ${id}?`)) return;
            UMSStorage.deleteData('students', id);
            UMSApp.toast(`Student ${id} removed.`, 'warning');
            renderStudents();
        }
    </script>
</body>

</html>
