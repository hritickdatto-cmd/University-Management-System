<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Management | BAUET</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <div class="app-wrapper">
        <aside class="app-sidebar" id="appSidebar"></aside>

        <div class="app-main">
            <header class="app-topbar" id="appTopbar"></header>

            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">University Fee Management & Billing</h1>
                        <p class="page-description">Student tuition invoicing, ledger reconciliation, and payment status verification</p>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="openFeeInvoiceModal()">
            <span>➕ Generate Student Invoice</span>
          </button>
                </div>

                
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="card-body" style="padding: 1rem 1.5rem;">
                        <div style="display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap;">
                            <div style="flex: 1; min-width: 240px;">
                                <input type="text" id="feeSearchInput" class="form-control" placeholder="Search by student ID or invoice number...">
                            </div>
                            <div class="toolbar-filters">
                                <select id="feeStatusFilter" class="form-control" style="width: auto;">
                  <option value="all">All Statuses</option>
                  <option value="Paid">Paid</option>
                  <option value="Partially Paid">Partially Paid</option>
                  <option value="Due">Due / Unpaid</option>
                </select>
                            </div>
                        </div>
                    </div>
                </div>

                
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Student Billing Accounts</h2>
                        <span class="badge badge-info" id="feeCountBadge">0 Accounts</span>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Invoice ID</th>
                                        <th>Student ID</th>
                                        <th>Semester</th>
                                        <th>Total Invoiced</th>
                                        <th>Amount Paid</th>
                                        <th>Balance Due</th>
                                        <th>Due Date</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="feesMasterTbody">
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    
    <div class="modal-overlay" id="feeModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" id="feeModalTitle">Issue Student Invoice</h3>
                <button class="modal-close" aria-label="Close modal">&times;</button>
            </div>
            <form id="feeForm">
                <input type="hidden" id="feeEditId">
                <div class="modal-body">
                    <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="fStudentId">Student ID <span class="required">*</span></label>
                            <input type="text" id="fStudentId" class="form-control" required placeholder="STU-2024-001">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="fSemester">Semester <span class="required">*</span></label>
                            <input type="text" id="fSemester" class="form-control" required value="Fall 2026">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="fTuition">Tuition Fee ($) <span class="required">*</span></label>
                            <input type="number" id="fTuition" class="form-control" required value="3200">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="fLab">Lab / Library Fees ($)</label>
                            <input type="number" id="fLab" class="form-control" value="500">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label" for="fPaid">Amount Paid ($)</label>
                            <input type="number" id="fPaid" class="form-control" value="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="fDueDate">Payment Due Date</label>
                            <input type="date" id="fDueDate" class="form-control" value="2026-10-15">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline btn-sm" onclick="UMSApp.closeModal('feeModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save Invoice</button>
                </div>
            </form>
        </div>
    </div>

    
    <script type="module" src="../js/firebase.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AdminPortal.init('fees', 'Fee Management');
            renderFees();

            document.getElementById('feeSearchInput').addEventListener('input', renderFees);
            document.getElementById('feeStatusFilter').addEventListener('change', renderFees);
            document.getElementById('feeForm').addEventListener('submit', handleSaveFee);
        });

        function renderFees() {
            const fees = UMSStorage.getData('fees');
            const search = document.getElementById('feeSearchInput').value.toLowerCase();
            const status = document.getElementById('feeStatusFilter').value;
            const tbody = document.getElementById('feesMasterTbody');

            const filtered = fees.filter(f => {
                const matchesSearch = f.studentId.toLowerCase().includes(search) || f.id.toLowerCase().includes(search);
                const matchesStatus = status === 'all' || f.status === status;
                return matchesSearch && matchesStatus;
            });

            document.getElementById('feeCountBadge').textContent = `${filtered.length} Records`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center" style="padding: 2.5rem;">No fee records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(f => {
                let badgeClass = 'badge-danger';
                if (f.status === 'Paid') badgeClass = 'badge-success';
                if (f.status === 'Partially Paid') badgeClass = 'badge-warning';

                return `
          <tr>
            <td><strong>${f.id}</strong></td>
            <td>${f.studentId}</td>
            <td><span class="badge badge-neutral">${f.semester}</span></td>
            <td>${UMSApp.formatCurrency(f.total)}</td>
            <td style="color: var(--success); font-weight: 600;">${UMSApp.formatCurrency(f.paid)}</td>
            <td style="color: var(--danger); font-weight: 700;">${UMSApp.formatCurrency(f.due)}</td>
            <td>${f.dueDate}</td>
            <td><span class="badge ${badgeClass}">${f.status}</span></td>
            <td>
              <div style="display: flex; gap: 0.35rem;">
                <button class="btn btn-outline btn-sm" onclick="editFee('${f.id}')">✏️</button>
                <button class="btn btn-outline btn-sm text-danger" onclick="deleteFee('${f.id}')" style="color: var(--danger); border-color: var(--danger);">🗑️</button>
              </div>
            </td>
          </tr>
        `;
            }).join('');
        }

        function openFeeInvoiceModal() {
            document.getElementById('feeModalTitle').textContent = 'Issue Student Invoice';
            document.getElementById('feeEditId').value = '';
            document.getElementById('fStudentId').value = 'STU-2024-001';
            document.getElementById('fSemester').value = 'Fall 2026';
            document.getElementById('fTuition').value = '3200';
            document.getElementById('fLab').value = '1000';
            document.getElementById('fPaid').value = '0';
            document.getElementById('fDueDate').value = '2026-10-15';
            UMSApp.openModal('feeModal');
        }

        function editFee(id) {
            const f = UMSStorage.findData('fees', item => item.id === id);
            if (!f) return;

            document.getElementById('feeModalTitle').textContent = 'Modify Invoice';
            document.getElementById('feeEditId').value = f.id;
            document.getElementById('fStudentId').value = f.studentId;
            document.getElementById('fSemester').value = f.semester;
            document.getElementById('fTuition').value = f.tuitionFee;
            document.getElementById('fLab').value = (f.labFee || 0) + (f.libraryFee || 0);
            document.getElementById('fPaid').value = f.paid;
            document.getElementById('fDueDate').value = f.dueDate;

            UMSApp.openModal('feeModal');
        }

        function handleSaveFee(e) {
            e.preventDefault();
            const editId = document.getElementById('feeEditId').value;
            const studentId = document.getElementById('fStudentId').value.trim();
            const semester = document.getElementById('fSemester').value.trim();
            const tuitionFee = parseFloat(document.getElementById('fTuition').value) || 0;
            const otherFee = parseFloat(document.getElementById('fLab').value) || 0;
            const paid = parseFloat(document.getElementById('fPaid').value) || 0;
            const dueDate = document.getElementById('fDueDate').value;

            const total = tuitionFee + otherFee;
            const due = Math.max(0, total - paid);
            let status = 'Due';
            if (due <= 0) status = 'Paid';
            else if (paid > 0) status = 'Partially Paid';

            if (editId) {
                UMSStorage.updateData('fees', editId, {
                    studentId,
                    semester,
                    tuitionFee,
                    total,
                    paid,
                    due,
                    dueDate,
                    status
                });
                UMSApp.toast('Invoice updated.', 'success');
            } else {
                const id = 'FEE-' + Date.now().toString().slice(-4);
                UMSStorage.addData('fees', {
                    id,
                    studentId,
                    semester,
                    tuitionFee,
                    semesterFee: 500,
                    labFee: otherFee,
                    total,
                    paid,
                    due,
                    dueDate,
                    status
                });
                UMSApp.toast('Student invoice generated.', 'success');
            }

            UMSApp.closeModal('feeModal');
            renderFees();
        }

        function deleteFee(id) {
            if (!confirm('Are you sure you want to delete this invoice record?')) return;
            UMSStorage.deleteData('fees', id);
            UMSApp.toast('Invoice deleted.', 'warning');
            renderFees();
        }
    </script>
</body>

</html>
